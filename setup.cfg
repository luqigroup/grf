[metadata]
name = grf
version = 0.1.0
description = Gaussian Random Field with efficient score computation via FFT
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
py_modules = grf_with_score
python_requires = >=3.8
install_requires =
    numpy>=1.20

[options.extras_require]
viz =
    matplotlib>=3.0
dev =
    matplotlib>=3.0
    pytest>=7.0
