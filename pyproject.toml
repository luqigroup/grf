[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grf"
version = "0.1.0"
description = "Gaussian Random Field with efficient score computation via FFT"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.0"]
dev = ["matplotlib>=3.0", "pytest>=7.0"]

[tool.setuptools]
py-modules = ["grf_with_score"]
